<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tabs Exercise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="tabs">
    <div class="tab-list">
      <button class="tab-btn active" data-tab="design">Design</button>
      <button class="tab-btn" data-tab="dev">Development</button>
      <button class="tab-btn" data-tab="pipeline">Pipeline</button>
    </div>

    <div class="tab-panel active" data-panel="design">
      <p>Design panel content — this is what shows when "Design" is active.</p>
    </div>
    <div class="tab-panel" data-panel="dev">
      <p>Development panel content — this is what shows when "Development" is active.</p>
    </div>
    <div class="tab-panel" data-panel="pipeline">
      <p>Pipeline panel content — this is what shows when "Pipeline" is active.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
